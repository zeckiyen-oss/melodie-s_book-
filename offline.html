<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — Mélodie's Book</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #0D1B2A;
      color: #FAF6ED;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Lato', sans-serif;
      margin: 0;
      padding: 1rem;
    }
    .offline-container {
      text-align: center;
      max-width: 400px;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      color: #F0D98A;
      margin: 0 0 1rem 0;
      font-family: 'Cinzel', serif;
      font-size: 2rem;
    }
    p {
      color: #C9A84C;
      margin: 0.5rem 0;
      line-height: 1.6;
    }
    .offline-note {
      background: rgba(201, 168, 76, 0.1);
      border-left: 4px solid #C9A84C;
      padding: 1rem;
      margin-top: 2rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Hors ligne</h1>
    <p>Vous n'êtes pas connecté à Internet.</p>
    <p>Reconnectez-vous pour accéder à Mélodie's Book.</p>
    
    <div class="offline-note">
      <strong>💡 Conseil :</strong> Les pages visitées en ligne restent disponibles en mode avion. Reconnectez-vous pour consulter d'autres sections.
    </div>
  </div>
</body>
</html>
