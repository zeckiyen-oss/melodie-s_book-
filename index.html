<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mélodie's Book — Connexion</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Feuille de style commune -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-login">

  <div class="login-bg">
    <div class="login-bg-glow login-bg-glow--top"></div>
    <div class="login-bg-glow login-bg-glow--bottom"></div>
    <div class="login-bg-cross">✝</div>
  </div>

  <main class="login-wrapper">
    <div class="login-card" id="loginCard">

      <div class="login-logo">
        <div class="login-logo__circle">♪</div>
      </div>

      <div class="login-heading">
        <h1 class="login-heading__title">Mélodie's Book</h1>
        <p class="login-heading__subtitle">Répertoire de la Chorale</p>
        <div class="login-heading__divider"></div>
      </div>

      <div class="login-status" id="loginStatus" style="display:none;"></div>

      <button class="btn-google" id="btnGoogle" onclick="signInWithGoogle()">
        <svg class="btn-google__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="btn-google__text">Continuer avec Google</span>
      </button>

      <div class="login-sep">
        <span>— Accès réservé aux membres de la chorale —</span>
      </div>

      <blockquote class="login-verse">
        « Chantez à l'Éternel un cantique nouveau,<br>
        chantez à l'Éternel, vous tous de la terre. »
        — Psaume 96 : 1
      </blockquote>

    </div>
  </main>

  <script>
    /* ─── 1. CONFIG SUPABASE ─────────────────────────────────── */
    const SUPABASE_URL  = 'https://tjqicfxkxhlciebmswqu.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqcWljZnhreGhsY2llYm1zd3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODg1NzQsImV4cCI6MjA5NDY2NDU3NH0.VyLZE6ldvMb4dYt5qqbqeS7OAS7fwYKxaj_x2wEHWJQ';

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

    /* ─── 2. VÉRIFIER SI DÉJÀ CONNECTÉ ──────────────────────── */
    function hasStoredSupabaseSession() {
      return Object.keys(localStorage).some(function(k) {
        return k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1;
      });
    }

    async function checkSession() {
      // Hors ligne, getSession() tente de rafraîchir le token et
      // EFFACE la session locale si ça échoue (comportement du SDK
      // Supabase). On l'évite en ne l'appelant jamais hors ligne.
      if (!navigator.onLine) {
        if (hasStoredSupabaseSession()) {
          window.location.href = 'dashboard';
        }
        return;
      }

      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          window.location.href = 'dashboard';
        }
      } catch (e) {
        console.warn('[checkSession] Vérification impossible :', e);
      }
    }
    checkSession();

    /* ─── 3. CONNEXION GOOGLE ────────────────────────────────── */
    async function signInWithGoogle() {
      const btn    = document.getElementById('btnGoogle');
      const status = document.getElementById('loginStatus');

      btn.disabled = true;
      btn.querySelector('.btn-google__text').textContent = 'Connexion en cours…';
      status.style.display = 'none';

      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/dashboard'
        }
      });

      if (error) {
        status.className     = 'login-status login-status--error';
        status.textContent   = '❌ Erreur : ' + error.message;
        status.style.display = 'block';
        btn.disabled         = false;
        btn.querySelector('.btn-google__text').textContent = 'Continuer avec Google';
      }
    }

    /* ─── 4. ÉCOUTER LE RETOUR OAUTH ─────────────────────────── */
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        window.location.href = 'dashboard';
      }
    });
  </script>

</body>
</html>
