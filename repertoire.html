<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mélodie's Book — Répertoire</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="navbar.js"></script>
  <script src="melodie-cache.js"></script>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0D1B2A" />
  



  
  <style>
    html, body { background: #0D1B2A !important; color: #FAF6ED !important; }
    .rep-liste { display:flex; flex-direction:column; gap:0.55rem; margin-bottom:2rem; }
    .rep-item {
      display:flex; flex-direction:column;
      padding:0.85rem 1.1rem;
      background:linear-gradient(145deg,rgba(26,46,69,0.85),rgba(13,27,42,0.95));
      border:1px solid rgba(201,168,76,0.15);
      border-radius:12px;
      color:#FAF6ED;
      box-sizing:border-box;
      transition:border-color 0.2s, box-shadow 0.2s;
      position:relative;
    }
    .rep-item:hover { border-color:rgba(201,168,76,0.4); box-shadow:0 4px 16px rgba(0,0,0,0.3); }
    .rep-item-main { display:flex; align-items:center; gap:0.9rem; text-decoration:none; color:#FAF6ED; }
    .rep-num { font-family:'Cinzel',serif; font-size:0.72rem; color:rgba(201,168,76,0.7); min-width:32px; flex-shrink:0; font-weight:600; }
    .rep-icon { font-size:1.3rem; flex-shrink:0; line-height:1; }
    .rep-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:0.25rem; }
    .rep-titre { font-family:'Lato',sans-serif; font-size:0.92rem; font-weight:700; color:#FAF6ED; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rep-meta { display:flex; flex-wrap:wrap; align-items:center; gap:0.4rem; }
    .rep-rubrique { font-size:0.65rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:2px 8px; border-radius:10px; border:1px solid; white-space:nowrap; }
    .rep-langue { font-size:0.72rem; color:rgba(250,246,237,0.45); }
    .rep-badges { display:flex; gap:0.3rem; flex-shrink:0; align-items:center; }
    .rep-btn-edit { background:transparent; border:1px solid rgba(201,168,76,0.25); border-radius:6px; padding:3px 7px; font-size:0.8rem; text-decoration:none; transition:background 0.2s,border-color 0.2s; flex-shrink:0; }
    .rep-btn-edit:hover { background:rgba(201,168,76,0.12); border-color:rgba(201,168,76,0.5); }
    .rep-audio-zone { margin-top:0.65rem; padding:0.7rem 0.8rem; background:rgba(13,27,42,0.5); border:1px solid rgba(201,168,76,0.15); border-radius:8px; display:none; flex-direction:column; gap:0.5rem; }
    .rep-audio-zone.open { display:flex; }
    .rep-audio-player { width:100%; border-radius:6px; display:block; }
    .rep-audio-actions { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .rep-btn-audio { display:inline-flex; align-items:center; gap:0.35rem; padding:0.3rem 0.75rem; border-radius:7px; font-family:'Lato',sans-serif; font-size:0.75rem; font-weight:700; cursor:pointer; border:none; transition:background 0.2s; }
    .rep-btn-ecouter { background:rgba(201,168,76,0.15); border:1px solid rgba(201,168,76,0.35); color:#F0D98A; }
    .rep-btn-ecouter:hover { background:rgba(201,168,76,0.28); }
    .filtres-row { display:flex; flex-wrap:wrap; gap:0.8rem; align-items:flex-end; }
    @media (max-width:600px) {
      .filtres-row { flex-direction:column; gap:0.6rem; }
      .filtre-group { width:100%; }
      .filtre-select { width:100%; }
      .page-header { flex-direction:column; align-items:flex-start; gap:0.8rem; }
      .rep-item { padding:0.75rem 0.9rem; }
      .rep-titre { font-size:0.86rem; }
    }
  </style>
</head>

<body class="dashboard-body">

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-logo">✦ Mélodie's Book</div>
    <div class="loading-spinner"></div>
  </div>

  <main class="main-content hidden" id="mainContent">

    <div class="page-header">
      <div class="page-header-left">
        <div class="page-header-icon">🎵</div>
        <div>
          <h1 class="page-title">Répertoire</h1>
          <p class="page-subtitle">Bibliothèque des chansons de la chorale</p>
        </div>
      </div>
      <div class="page-header-actions" id="adminActions" style="display:none;">
        <a href="ajouter-chanson" class="btn-primary" data-online-only="1">
          <span>➕</span> Ajouter une chanson
        </a>
      </div>
    </div>

    <div class="repertoire-controls">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Rechercher par titre, numéro…" class="search-input" />
        <button class="search-clear hidden" id="searchClear">✕</button>
      </div>
      <div class="filtres-row">
        <div class="filtre-group">
          <label class="filtre-label">Rubrique</label>
          <select class="filtre-select" id="filtreRubrique">
            <option value="">Toutes</option>
            <option value="Adoration">Adoration</option>
            <option value="Louange">Louange</option>
            <option value="Prélude">Prélude</option>
            <option value="Offrande">Offrande</option>
            <option value="Méditation">Méditation</option>
            <option value="Envoi">Envoi</option>
            <option value="Chant de réflexion">Chant de réflexion</option>
          </select>
        </div>
        <div class="filtre-group">
          <label class="filtre-label">Langue</label>
          <select class="filtre-select" id="filtreLangue">
            <option value="">Toutes</option>
            <option value="Français">Français</option>
            <option value="Anglais">Anglais</option>
            <option value="Gun">Gun</option>
            <option value="Fon">Fon</option>
            <option value="Adja">Adja</option>
            <option value="Yoruba">Yoruba</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="filtre-group">
          <label class="filtre-label">Trier par</label>
          <select class="filtre-select" id="triSelect">
            <option value="numero">Numéro</option>
            <option value="titre">Titre A→Z</option>
            <option value="rubrique">Rubrique</option>
          </select>
        </div>
      </div>
    </div>

    <div class="repertoire-info">
      <span class="repertoire-count" id="repertoireCount">Chargement…</span>
    </div>

    <div class="rep-liste" id="chansonsList"></div>

    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">🎼</div>
      <div class="empty-title">Aucune chanson trouvée</div>
      <div class="empty-text">Modifiez vos filtres ou ajoutez une nouvelle chanson.</div>
    </div>

    <div class="pagination" id="pagination"></div>

  </main>

  <script>
    var SUPABASE_URL = 'https://tjqicfxkxhlciebmswqu.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqcWljZnhreGhsY2llYm1zd3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODg1NzQsImV4cCI6MjA5NDY2NDU3NH0.VyLZE6ldvMb4dYt5qqbqeS7OAS7fwYKxaj_x2wEHWJQ';
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window._sb = sb;

    var RUBRIQUES_COLORS = {
      'Adoration':          { bg:'rgba(201,168,76,0.12)',  border:'rgba(201,168,76,0.4)',  text:'#F0D98A' },
      'Louange':            { bg:'rgba(91,163,201,0.12)',  border:'rgba(91,163,201,0.4)',  text:'#7ECFF0' },
      'Prélude':            { bg:'rgba(156,126,204,0.12)', border:'rgba(156,126,204,0.4)', text:'#C5B3E8' },
      'Offrande':           { bg:'rgba(91,170,125,0.12)',  border:'rgba(91,170,125,0.4)',  text:'#6EC99A' },
      'Méditation':         { bg:'rgba(200,120,80,0.12)',  border:'rgba(200,120,80,0.4)',  text:'#F0A882' },
      'Envoi':              { bg:'rgba(180,180,60,0.12)',  border:'rgba(180,180,60,0.4)',  text:'#E0E070' },
      'Chant de réflexion': { bg:'rgba(130,180,200,0.12)', border:'rgba(130,180,200,0.4)', text:'#A8D8EA' }
    };
    var RUBRIQUES_ICONS = {
      'Adoration':'🙏','Louange':'🎶','Prélude':'🌅',
      'Offrande':'🕊️','Méditation':'✨','Envoi':'🚀','Chant de réflexion':'💭'
    };

    var allChansons = [], filteredChansons = [];
    var currentPage = 1, PER_PAGE = 20, userRole = 'membre';

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderChansons() {
      var list = document.getElementById('chansonsList');
      var empty = document.getElementById('emptyState');
      if (filteredChansons.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        document.getElementById('pagination').innerHTML = '';
        document.getElementById('repertoireCount').textContent = 'Aucune chanson trouvée';
        return;
      }
      empty.classList.add('hidden');
      document.getElementById('repertoireCount').textContent =
        filteredChansons.length + ' chanson' + (filteredChansons.length > 1 ? 's' : '');

      var start = (currentPage - 1) * PER_PAGE;
      var pageItems = filteredChansons.slice(start, start + PER_PAGE);
      list.innerHTML = '';

      pageItems.forEach(function(c) {
        var rc = RUBRIQUES_COLORS[c.rubrique] || { bg:'rgba(255,255,255,0.05)', border:'rgba(255,255,255,0.2)', text:'#FAF6ED' };
        var icon = RUBRIQUES_ICONS[c.rubrique] || '🎵';

        var div = document.createElement('div');
        div.className = 'rep-item';

        var adminBtn = userRole === 'admin'
          ? '<a href="modifier-chanson?id=' + c.id + '" class="rep-btn-edit" title="Modifier" data-online-only="1" onclick="event.stopPropagation()">✏️</a>' : '';

        var audioBadge = c.audio_url ? '<span title="Audio disponible">🎵</span>' : '';

        var mainHtml = '<a href="chanson?id=' + c.id + '" class="rep-item-main">'
          + '<div class="rep-num">' + (c.numero ? '#' + escHtml(String(c.numero)) : '—') + '</div>'
          + '<div class="rep-icon">' + icon + '</div>'
          + '<div class="rep-info">'
          + '<div class="rep-titre">' + escHtml(c.titre) + '</div>'
          + '<div class="rep-meta">'
          + '<span class="rep-rubrique" style="color:' + rc.text + ';border-color:' + rc.border + ';background:' + rc.bg + ';">' + escHtml(c.rubrique || '—') + '</span>'
          + '<span class="rep-langue">' + escHtml(c.langue || '—') + '</span>'
          + (c.style ? '<span class="rep-langue">' + escHtml(c.style) + '</span>' : '')
          + '</div></div>'
          + '<div class="rep-badges">' + audioBadge + adminBtn + '</div>'
          + '</a>';

        var audioZoneHtml = '';
        if (c.audio_url) {
          var zoneId   = 'audio-zone-' + c.id;
          var playerId = 'audio-player-' + c.id;
          audioZoneHtml = '<div class="rep-audio-actions" style="margin-top:0.5rem;display:flex;gap:0.5rem;flex-wrap:wrap;">'
            + '<button class="rep-btn-audio rep-btn-ecouter" data-zone="' + zoneId + '" data-player="' + playerId + '" data-url="' + escHtml(c.audio_url) + '">🎧 Écouter</button>'
            + '</div>'
            + '<div class="rep-audio-zone" id="' + zoneId + '">'
            + '<audio class="rep-audio-player" id="' + playerId + '" controls controlsList="nodownload" preload="none"></audio>'
            + '</div>';
        }

        div.innerHTML = mainHtml + audioZoneHtml;
        list.appendChild(div);
      });

      list.querySelectorAll('.rep-btn-ecouter').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          var zoneId   = btn.getAttribute('data-zone');
          var playerId = btn.getAttribute('data-player');
          var url      = btn.getAttribute('data-url');
          var zone     = document.getElementById(zoneId);
          var player   = document.getElementById(playerId);
          if (!zone || !player) return;
          var isOpen = zone.classList.contains('open');
          list.querySelectorAll('.rep-audio-zone.open').forEach(function(z) {
            z.classList.remove('open');
            var p = z.querySelector('audio');
            if (p) { p.pause(); p.src = ''; }
          });
          list.querySelectorAll('.rep-btn-ecouter').forEach(function(b) { b.textContent = '🎧 Écouter'; });
          if (!isOpen) {
            zone.classList.add('open');
            player.src = url;
            player.play();
            btn.textContent = '⏹ Fermer';
          }
        });
      });

      renderPagination();

      // Réapplique les gardes hors ligne sur les liens "Modifier" qu'on vient d'injecter
      if (window.melodieApplyOfflineGuards) window.melodieApplyOfflineGuards();
    }

    function renderPagination() {
      var total = Math.ceil(filteredChansons.length / PER_PAGE);
      var pg = document.getElementById('pagination');
      if (total <= 1) { pg.innerHTML = ''; return; }
      var html = '';
      if (currentPage > 1) html += '<button class="pg-btn" onclick="goPage(' + (currentPage-1) + ')">←</button>';
      for (var i = 1; i <= total; i++)
        html += '<button class="pg-btn ' + (i===currentPage?'active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
      if (currentPage < total) html += '<button class="pg-btn" onclick="goPage(' + (currentPage+1) + ')">→</button>';
      pg.innerHTML = html;
    }

    function goPage(n) { currentPage = n; renderChansons(); window.scrollTo({top:0,behavior:'smooth'}); }

    function applyFiltres() {
      var search   = document.getElementById('searchInput').value.toLowerCase().trim();
      var rubrique = document.getElementById('filtreRubrique').value;
      var langue   = document.getElementById('filtreLangue').value;
      var tri      = document.getElementById('triSelect').value;
      document.getElementById('searchClear').classList.toggle('hidden', !search);
      filteredChansons = allChansons.filter(function(c) {
        return (!search || (c.titre&&c.titre.toLowerCase().indexOf(search)!==-1) || (c.numero&&String(c.numero).indexOf(search)!==-1))
          && (!rubrique || c.rubrique===rubrique)
          && (!langue   || c.langue===langue);
      });
      filteredChansons.sort(function(a,b) {
        if (tri==='numero')   return (a.numero||9999)-(b.numero||9999);
        if (tri==='titre')    return (a.titre||'').localeCompare(b.titre||'');
        if (tri==='rubrique') return (a.rubrique||'').localeCompare(b.rubrique||'');
        return 0;
      });
      currentPage = 1;
      renderChansons();
    }

    async function init() {
      var identity;
      try {
        identity = await melodieResolveIdentity();
      } catch (e) {
        console.warn('[init] melodieResolveIdentity a échoué :', e);
        window.location.href = '/';
        return;
      }
      if (!identity) return; // déjà redirigé vers la connexion
      if (!identity.profil.actif) { window.location.href = '/'; return; }

      userRole = identity.profil.role || 'membre';
      await buildSharedNavbar(identity.profil, 'repertoire');
      if (userRole === 'admin') {
        document.getElementById('adminActions').style.display = 'flex';
        if (window.melodieApplyOfflineGuards) window.melodieApplyOfflineGuards();
      }

      var premierAffichage = true;

      await melodieCache('repertoire-chansons-all', async function() {
        var res = await sb.from('chansons').select('*').order('numero', { ascending: true });
        if (res.error) throw res.error;
        return res.data || [];
      }, function(data, fromCache) {
        if (data === null) {
          document.getElementById('repertoireCount').textContent = 'Indisponible hors ligne';
          document.getElementById('chansonsList').innerHTML = '';
          document.getElementById('emptyState').classList.remove('hidden');
          document.querySelector('.empty-title').textContent = 'Aucune donnée hors ligne';
          document.querySelector('.empty-text').textContent = 'Connectez-vous à internet une première fois pour charger le répertoire.';
        } else {
          allChansons = data;
          applyFiltres();
        }

        if (premierAffichage) {
          document.getElementById('loadingOverlay').classList.add('hidden');
          document.getElementById('mainContent').classList.remove('hidden');
          premierAffichage = false;
        }
      });
    }

    document.getElementById('searchInput').addEventListener('input', applyFiltres);
    document.getElementById('searchClear').addEventListener('click', function() {
      document.getElementById('searchInput').value = ''; applyFiltres();
    });
    document.getElementById('filtreRubrique').addEventListener('change', applyFiltres);
    document.getElementById('filtreLangue').addEventListener('change', applyFiltres);
    document.getElementById('triSelect').addEventListener('change', applyFiltres);

    init();
  </script>

  <script src="pwa-register.js"></script>
</body>
</html>
